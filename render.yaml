services:
  - type: web
    name: syllabusai-backend
    env: python
    runtime: python
    pythonVersion: "3.11"
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false  # set this manually in the Render dashboard. DO NOT COMMIT.
      - key: OPENAI_API_KEY
        sync: false  # set this manually in the Render dashboard. do not commit.
      - key: ALLOWED_ORIGINS
        sync: false  # set to your Vercel URL, e.g. https://syllabusai.vercel.app
